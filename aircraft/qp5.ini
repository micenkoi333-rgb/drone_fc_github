# qp5.ini — «QP-5 TiltQuad v3»: електричний конвертоплан розмахом 1000 мм, 2370 г, 4 поворотні мотори, без корисного навантаження.
# Джерело — інженерна документація «QP-5 TiltQuad v3» (2026-11-13). Позначки: [Д] — з документації, [О] — оцінка (у документації немає),
# [П] — дані гвинтів/моторів за пам'яттю з відкритих вимірів (UIUC), уточнити.
# Система координат тіла симулятора: X вперед, Y вліво, Z вгору, початок — центр мас. У документації X = 0 — фокус крила, ЦМ на X = +2.1 мм:
# тут x = X − 0.0021 м. Формат і зміст розділів — як у tiltrotor.ini.

[geometry]
wing_span_m        = 1.000    # [Д]
wing_chord_m       = 0.330    # [Д] коренева хорда
wing_tip_chord_m   = 0.165    # [Д] кінцева (звуження 0.5); S 0.2475 м², подовження 4.04, САХ 256.7 мм
wing_tip_twist_deg = -2.0     # [Д] закрутка кінців
cg_chord_frac      = 0.3287   # [Д] фокус крила X +22.3 мм, ЦМ X +2.1 → ЦМ на 25% + 20.2/256.7 САХ
overall_length_m   = 0.877    # [Д] корпус з ПВД X +395 … балка X −482
nose_x_m           = 0.393
tail_x_m           = -0.484
boom_length_m      = 0.50     # [Д] вуглецева трубка 16/14, ≈ 500 мм
boom_od_m          = 0.016
boom_id_m          = 0.014
