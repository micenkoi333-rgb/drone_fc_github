# tiltrotor.ini — єдине джерело параметрів апарата «Конвертоплан»: літак із вертикальним злітом і 4 поворотними гвинтами.
# Схема «два крила»: основне крило й нижнє заднє крило, кожне несе пару гондол на коротких пілонах перед передньою кромкою
# (гвинти посередині консолей, y = ±0.40); зверху на кінці хвостової балки — малий V-хвіст. Крило, мотори, гвинти й батарея — як у QuadPlane.
# Формат: [розділ], ключ = значення(ня), коментар після #.
# Система координат тіла: X вперед, Y вліво, Z вгору, початок — центр мас (55% хорди основного крила). Усі довжини в метрах, маси в кг.
# Позначки у коментарях: [К] — з креслення QuadPlane (крило, мотори, батарея), [Д] — з джерела (docs/AERO_MODEL.md),
# [О] — припущення/оцінка (креслення конвертоплана немає), [К-опис] — з опису користувача.

[geometry]
wing_span_m        = 1.6      # [К] основне крило те саме, що й у QuadPlane
wing_chord_m       = 0.28     # [К] прямокутне крило
cg_chord_frac      = 0.550    # [О] центр мас на 55% хорди основного крила: запас стійкості 8.8% САХ (схема «два крила»)
overall_length_m   = 1.20     # [О] від носа до кінця хвостової балки (nose_x − tail_x)
nose_x_m           = 0.40     # [О]
tail_x_m           = -0.80    # [О] кінець хвостової балки (за V-хвостом)
boom_length_m      = 0.68     # [О] хвостова балка карбон 20/18 від фюзеляжу (−0.12) до кінця
boom_od_m          = 0.020
boom_id_m          = 0.018
gear_height_m      = 0.24     # [О] 4 ніжки TPU 95A під крилами: штовхальний задній гвинт висить під мотором, а на посадці літаком гвинти вертикальні
wing_z_m           = 0.04     # [О] площина основного крила над ЦМ
wing_incidence_deg = 0.0      # [О]

[rear_wing]
# Заднє крило — нижче за основне (під хвостовою балкою), за задніми гондолами; на звалюванні несе ≈ 10% ваги (на крейсері майже лише врівноважує момент профілю) і має руль висоти.
span_m             = 1.00     # [О] розмах; задні гондоли на y = ±0.40 — на пілонах перед передньою кромкою
chord_m            = 0.16     # [О] AR 6.25
le_x_m             = -0.512   # [О] передня кромка: центр заднього диска (x = −0.35) на R + 3.5 см попереду
z_m                = 0.00     # [О] 4 см нижче основного крила (слід основного крила проходить над ним)
incidence_deg      = -2.0     # [О] −2° до основного: момент cm0 профілю Clark Y (пікіруючий) врівноважено без відхилення руля на 15 м/с
strips_per_half    = 8
elevator_chord_frac = 0.30    # [О] руль висоти на задньому крилі (разом з V-хвостом)

[tail]
type               = v        # V-хвіст на кінці балки над заднім крилом: курсова стійкість, рулі напряму (й допомога руля висоти)
vtail_panel_m      = 0.25     # [О] довжина панелі; кінці на y = ±0.19 — далеко від задніх дисків (y 0.27…0.53)
vtail_chord_m      = 0.11     # [О]
vtail_dihedral_deg = 40       # [О]
vtail_le_x_m       = -0.69    # [О] за задньою кромкою заднього крила (−0.672)
vtail_root_z_m     = 0.03     # [О] верх балки

[aero]
airfoil            = ClarkY   # [Д] рекомендація Етапу 0
cl_max_2d          = 1.38     # [Д] NeuralFoil, Re 3e5
cl_max_3d          = 1.20     # [О] ≈0.85–0.9 від 2D
cl_alpha_3d        = 4.35     # [Д] 1/рад, Гельмбольд/VLM
alpha_zero_deg     = -3.9     # [Д]
cd0_wing           = 0.0083   # [Д] профільний мінімум; повна модель — Етап 3
cm0_wing           = -0.08    # [О] момент профілю Clark Y відносно чверті хорди (у моделі — з таблиці; тут для оцінки частки заднього крила)
oswald_e           = 0.88     # [О]
alpha_stall_3d_deg = 15.0     # [Д]
tail_cl_alpha      = 3.63     # [О] V-хвіст: нахил по нормалі до площини панелі (AR панелі ≈ 2.25 ×2 з дзеркалом ≈ 4.5 → ≈ 3.6), Гельмбольд
tail_efficiency    = 0.90     # [О] η_h
air_density        = 1.225    # ISA на рівні моря

[aero_model]
wing_table              = clarky_re3e5       # імена таблиць у aircraft/aero_tables.json
tail_table              = naca0010_re1p5e5
wing_strips_per_half    = 12                 # смуг на консоль (Селіг: ~20 на все крило)
vtail_strips_per_panel  = 5                  # смуг на кожну панель V-хвоста
tail_downwash_min_mps   = 3.0                # нижче цієї швидкості скіс потоку від крила на хвості не рахується
dynamic_stall           = 1                  # динамічний зрив (Гоман–Храбров, τ1 = 3c/V, τ2 = 1.5c/V) [О]
rotor_ground_effect     = 1                  # ефект землі підйомних гвинтів (Cheeseman–Bennett)
rotor_vortex_ring       = 1                  # вихрове кільце при швидкому вертикальному зниженні [О амплітуди]
rotor_bem               = 1                  # гвинти в косому потоці — теорія елемента лопаті (дельта до таблиць UIUC): тяга, H і бічна сила, моменти асиметрії
tilt_gyroscopic         = 1                  # гіроскопічний момент при повороті гондоли з ротором, що крутиться
wing_table_re           = 300000             # Re таблиць профілю: профільний опір ∝ Re^−0.2 відносно них
tail_table_re           = 150000
rotor_wash_on_wing      = 1                  # слід гвинтів на крилі й V-хвості (у висінні — задні гвинти над/під панелями, у польоті — передні на крилі)
rotor_rotor_interference = 1                # слід одних підйомних гвинтів на дисках інших (у переходах передні дмуть на задні)

[controls]
aileron_chord_frac      = 0.25     # [О] на кресленні елеронів немає — припущення
servo_backlash_deg      = 0.2      # [О] люфт тяг рулів
aileron_inner_frac      = 0.45     # [О] від половини розмаху
aileron_outer_frac      = 0.95
elevator_chord_frac     = 0.35     # [О] рулі V-хвоста (ruddervator): одночасне відхилення — висота,
rudder_chord_frac       = 0.35     # [О] різницеве — напрям (мікшування як у V-хвості ArduPilot)
effectiveness_derate    = 0.80     # [О] в'язкі втрати ефективності проти тонкого профілю
max_deflection_deg      = 25       # [О]
flap_cm_per_cl          = 0.35     # [О] Δcm = −0.35·Δcl керма
flap_drag_coeff         = 1.0      # [О] Δcd = 1.0·Δα²

[drag]
# Квадратичний опір корпусу, хвостової балки, гондол, шасі й камери. CdA, м² [О] — сума оцінок за Hörner:
# корпус 0.0025, балка 0.0003, 4 гондоли з пілонами 4×0.0008, 4 ніжки 0.0040, камера 0.0015.
# Гвинти рахуються окремо (модель гвинта: тяга, H-сила, режим вітряка).
cda_x_m2   = 0.012
cda_y_m2   = 0.08                 # [О] збоку: корпус, балка, гондоли, шасі (крило й хвіст — смугами)
cda_z_m2   = 0.08                 # [О] зверху/знизу: корпус, балка, гондоли, балки гондол
cp_z_m     = -0.015               # [О] центр опору трохи нижче ЦМ (шасі, камера)
munk_volume_m3 = 0.0045           # [О] об'єм корпусу (0.52×0.11×0.10 м × 0.65 ≈ 0.0037) + 4 гондол (≈ 0.0002 кожна): момент Мунка
munk_k         = 0.85             # [О] k2 − k1 для видовженого тіла L/D ≈ 5 (Munk, Hoerner)

[ground]
# Контакт із землею: пружина-демпфер по вертикалі + кулонівське тертя. 4 ніжки TPU 95A під крилами (м'які),
# жорсткі точки (ніс, кінці крил, кінці V-хвоста, хвіст).
gear_stiffness_n_m   = 3000      # [О] на ніжку; статичний прогин ≈ 3 мм
gear_damping_ns_m    = 30        # [О] ζ ≈ 0.3
hard_stiffness_n_m   = 20000     # [О]
hard_damping_ns_m    = 100       # [О]
friction_mu          = 0.6       # [О] TPU по траві/асфальту
slip_reg_mps         = 0.05      # регуляризація тертя біля нульової швидкості ковзання
crash_vz_mps         = 3.5       # вертикальна швидкість удару жорсткою точкою, що вважається аварією
gear_crash_vz_mps    = 4.5       # те саме для ніжок
# м'які опори x y z (низ ніжки): 4 ніжки — передні під основним крилом, задні під заднім (не під гондолами: штовхальний гвинт у висінні висить під мотором)
gear_points = 0.15 0.40 -0.20  0.15 -0.40 -0.20  -0.59 0.40 -0.20  -0.59 -0.40 -0.20
# жорсткі точки x y z: ніс; кінці основного крила; кінці заднього крила; кінці V-хвоста; кінець балки
hard_points = 0.40 0 -0.05  0.084 0.8 0.04  0.084 -0.8 0.04  -0.552 0.5 0.0  -0.552 -0.5 0.0  -0.72 0.19 0.19  -0.72 -0.19 0.19  -0.80 0 0.02

[servo]
tau_s               = 0.05       # [О] постійна часу рульової машинки
rate_limit_rad_s    = 8.0        # [О] ≈ 460°/с
stall_nm            = 0.45       # [О] момент зупинки цифрової машинки класу 9–13 г (≈ 4.5 кг·см)
deadband_deg        = 0.1        # [О] мертва зона регулятора (≈ 1 мкс ШІМ)
compliance_deg_per_nm = 3.0      # [О] прогин тяги/качалки під моментом
hinge_ch_delta      = 0.55       # [О] |∂Ch/∂δ| — шарнірний момент руля = q·S·c·Ch_δ·δ

[avionics]
power_w             = 12         # [О] польотний контролер, GPS, радіо, камера у режимі очікування

[vtol_motor]
count           = 4
# осі повороту гондол (x y z): передні — посередині консолей, винесені вперед від крила; задні — на кінцях V-хвоста
front_x_m       = 0.35        # [О] вісь повороту передньої гондоли: короткий пілон, диск у висінні на 6.9 см перед передньою кромкою (+0.154)
front_y_m       = 0.40        # [К-опис] «посередині передніх крил»: половина напіврозмаху 0.8 м
front_z_m       = 0.04        # [О] площина крила
rear_x_m        = -0.35       # [О] пілон перед заднім крилом; плечі ±0.35 м — передні й задні несуть порівну
rear_y_m        = 0.40        # як у передніх: прямокутник 0.7 × 0.8 м з центром у ЦМ — при відмові мотора діагональ проходить через ЦМ
rear_z_m        = 0.00        # площина заднього крила
kv              = 1100        # [К] 2810
rm_ohm          = 0.061       # [Д] T-Motor F100 2810 1100KV
i0_a            = 1.3         # [О] не знайдено у джерелі
max_cont_a      = 45.6        # [Д]
esc_eff         = 0.96        # [О]
heat_capacity_j_k = 27        # [О] обмотка й статор ≈ 67 г × 0.4 Дж/(г·К)
cooling_w_k     = 0.35        # [О] тепловіддача на холостих; на обертах — більше (обдув)
ambient_c       = 25
esc_damped      = 1           # [О] 1 — активне гальмування (damped light / complementary PWM, типово в BLHeli_32/AM32): мотор швидко сповільнюється при зменшенні duty

[vtol_prop]
diameter_m = 0.254            # [К] 10"
pitch_m    = 0.1143           # [К] 4.5"
blades     = 2
mass_kg    = 0.013            # [О]
ct0        = 0.128            # [Д] UIUC APC SF 10x4.7 (найближчий до 10x4.5), статика 6000–6500 об/хв
cp0        = 0.052            # [Д]
j_zero_ct  = 0.655            # [Д] J при CT=0
# Таблиця CT(J), CP(J) для осьового J = V_осьова/(nD). J=0 — статика; точки при 6020 об/хв. Поза таблицею — лінійна екстраполяція
# (за J<0, тобто зворотний осьовий потік, тяга росте; за великим J — режим вітряка, CP<0).
j_table    = 0.0     0.408   0.507   0.601   0.652   0.774        # [Д] UIUC APC SF 10x4.7; точку J=0 взято зі статики, між 0 і 0.408 даних немає [О]
ct_table   = 0.128   0.0624  0.0405  0.0160  0.0017  -0.0347
cp_table   = 0.052   0.0397  0.0331  0.0254  0.0207  0.0085
rotor_inertia = 2.0e-5        # кг·м² ротор мотора + гвинт [О]
h_force_k  = 0.5              # [О] поперечна сила H = k·CT0·ρ·n·D³·V_perp (Khan/Selig не отримано; фізична оцінка)
stopped_cda_m2 = 0.0015       # [О] опір зупиненого гвинта в осьовому потоці: 2 лопаті ≈ 0.005 м² × Cd ≈ 0.3 (лопаті під кутом кроку)

[tilt]
# Поворотні гондоли (схема «конвертоплан»): кут 0° — гвинт тягне вгору (висіння), 90° — уперед (політ літаком).
# Передні гвинти тягнучі. Задні — rear_pusher = 1: штовхальні (у висінні гвинт ПІД мотором, у польоті позаду гондоли),
# rear_pusher = 0: тягнучі (як передні, гвинт над мотором / попереду). Обидві гондоли повертаються «верхом уперед» — тяга йде вперед.
rear_pusher          = 1        # 1 — задні штовхають (варіант користувача), 0 — задні тягнуть
backlash_deg         = 0.3      # [О] люфт механізму нахилу (шестерні сервоприводу + шарнір)
pusher_thrust_factor = 0.94     # [О] штовхальний гвинт у затіненні гондоли/мотора: −6% тяги за тієї самої потужності (5–8% за даними для pusher-гвинтів)
prop_offset_m        = 0.06     # [О] від осі повороту до площини гвинта (уздовж осі тяги; штовхальний — у протилежний бік)
min_deg              = -25      # [О] нахил назад: гальмування у висінні й на переході в коптер, рискання
max_deg              = 92       # [О] трохи далі за 90° — запас для рискання в польоті
rate_deg_s           = 90       # [О] швидкість сервоприводу нахилу (≈ 1 с на повний поворот)
tau_s                = 0.05     # [О] стала часу сервоприводу
servo_stall_nm       = 2.9      # [О] момент зупинки приводу нахилу (≈ 30 кг·см, клас DS3230); навантаження — H-сила гвинта на плечі prop_offset і гіроскопічний момент ротора
servo_deadband_deg   = 0.15     # [О]
servo_compliance_deg_per_nm = 0.6   # [О] прогин кронштейна гондоли
nacelle_inertia_kgm2 = 0.0004   # [О] гондола з мотором і гвинтом навколо осі нахилу (мотор 68 г на плечі ≈ 4 см + гвинт)
yaw_vector           = 1        # 1 — рискання у висінні різницевим нахилом гондол (векторне), 0 — лише реактивним моментом гвинтів
cruise_rear          = 2        # у польоті літаком: 0 — тягнуть лише передні (задні стоять), 1 — усі 4 порівну, 2 — передні, задні вмикаються на допомогу (набір, розгін, сильний вітер)
#   4 гвинти, підібрані для висіння, на крейсері навантажені слабко (J ≈ 0.6, CT ≈ 0.02) — ККД низький; 2 гвинти вдвічі навантаженіші й економніші на ≈ 27%
fwd_thrust_limit_n   = 12       # [О] найбільша тяга вперед, яку просить контролер (розгін у переході, крейсер)

[battery]
cells_series        = 6        # [К]
cells_parallel      = 2        # [К]
cell_capacity_ah    = 3.6      # [О] ефективна ємність комірки 21700 (клас 4 Аг з запасом)
cell_nominal_v      = 3.6      # [Д]
cell_r0_ohm         = 0.016    # [Д] Molicel P42A, DC 16 мОм
usable_wh_target    = 155      # [К]
r1_over_r0          = 0.6      # [О] R1 = 0.6·R0 (типова пара RC для NMC), τ1 = R1·C1
tau1_s              = 25       # [О] стала часу RC-ланки
heat_capacity_j_k   = 840      # [О] 12 комірок × 70 Дж/К
cooling_w_per_k     = 0.8      # [О] обдув на крейсері; у висінні гірше
ambient_c           = 25
v_cutoff_cell       = 3.0      # [О] відсічка за напругою комірки
# OCV(SoC) комірки NMC/NCA 21700 [О]: типова крива; для точності зняти з даташита
ocv_soc  = 0.00 0.05 0.10 0.20 0.30 0.40 0.50 0.60 0.70 0.80 0.90 1.00
ocv_v    = 2.90 3.20 3.36 3.48 3.57 3.64 3.72 3.80 3.88 3.97 4.06 4.15
# множник опору від температури, °C [О]: R0(T) = R0·k(T)
rt_temp_c = -10  0   10   25   40
rt_factor =  3.0 2.0 1.4  1.0  0.85
# множник ємності від температури [О]
ct_temp_c = -10  0    25   40
ct_factor = 0.85 0.90 1.0  1.0

[targets]
v_stall_mps        = 7.9      # [О] два крила: основне на CLmax несе ≈ 90% ваги (заднє — решту)
v_cruise_min_mps   = 14       # [О] легший апарат: крейсер ≈ 1.8·Vs
v_cruise_max_mps   = 16       # [О]
endurance_min      = 30       # [К]
range_km           = 5        # [К] + повернення
takeoff_mass_kg    = 2.386    # сума [mass]: два крила, 4 гондоли на пілонах з приводами нахилу, V-хвіст, 4 ніжки
sm_min_frac        = 0.05     # запас стійкості, частка САХ
sm_max_frac        = 0.15

# [mass] — розподіл мас за компонентами:  назва = маса x y z  dx dy dz   (dx dy dz — габарит однорідного паралелепіпеда
# для власної інерції; 0 0 0 — точкова маса). Маса гондол не зсувається при повороті (≈ 1 см ЦМ гондоли — знехтувано).
[mass]
battery           = 0.900  +0.1278  0.0    -0.02   0.20  0.10  0.05    # [К] 0.9–1.0 кг; x підібрано під ЦМ = 0
fuselage_shell    = 0.1300  +0.1400  +0.0000  +0.0000   0.52  0.11  0.10
tail_boom         = 0.0700  -0.4600  +0.0000  +0.0200   0.68  0.03  0.03
